name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run tests
        run: swift test --arch arm64

      - name: Build application
        env:
          CONFIGURATION: release
        run: ./script/build_and_run.sh --package

      - name: Verify architecture and signature
        run: |
          file dist/MenuCal.app/Contents/MacOS/MenuCal
          lipo -info dist/MenuCal.app/Contents/MacOS/MenuCal | grep arm64
          codesign --verify --deep --strict --verbose=2 dist/MenuCal.app
